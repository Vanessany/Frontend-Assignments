<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/cats.jpg" alt="Two tabby kittens sleeping together on a couch." />
    <!--src tells the browser to go fetch the image file from this url(location) and display it on the page. The src attribute is required for the <img> element to work properly.-->
    <!--alt is used to describe the image. This is important for accessibility reasons, as it allows screen readers to describe the image to users who are visually impaired. The alt attribute is also used by search engines to understand the content of the image.-->
    <!-- img just creates space on the webpage waiting for the image and src directs the browser to the location of the image -->
     
</body>
</html>
